services:
  app1:
    image: nginx:alpine
    volumes: 
      - ./app1:/usr/share/nginx/html:ro
  app2:
    image: nginx:alpine
    volumes:
      - ./app2:/usr/share/nginx/html:ro
  app3:
    image: nginx:alpine
    volumes:
      - ./app3:/usr/share/nginx/html:ro
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
